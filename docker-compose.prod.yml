version: '3.8'

services:
  # 1. Neo4j Graph Database
  neo4j:
    image: neo4j:5.19.0-community
    container_name: graphrag-neo4j-prod
    restart: unless-stopped
    ports:
      - "7474:7474" # Web Console (Access via Nginx or direct tunnel)
      - "7687:7687" # Bolt Protocol (FastAPI connection)
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - ./backend/data/neo4j/data:/data
      - ./backend/data/neo4j/logs:/logs
      - ./backend/data/neo4j/import:/var/lib/neo4j/import
      - ./backend/data/neo4j/plugins:/plugins
    networks:
      - graphrag-network

  # 2. Redis Caching
  redis:
    image: redis:7.2-alpine
    container_name: graphrag-redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - graphrag-network

  # 3. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: graphrag-backend-prod
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENV_STATE=prod
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=AQ.${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - neo4j
      - redis
    networks:
      - graphrag-network

  # 4. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000
    container_name: graphrag-frontend-prod
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - graphrag-network

networks:
  graphrag-network:
    driver: bridge
