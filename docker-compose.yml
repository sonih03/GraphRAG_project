services:
  neo4j:
    image: neo4j:5.19.0-community
    container_name: graphrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser Web UI
      - "7687:7687" # Bolt Protocol (FastAPI Backend Driver)
    environment:
      # Authentication loaded from .env (default: neo4j/password)
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      # Enable APOC plugin for advanced graph algorithms & procedures
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - ./backend/data/neo4j/data:/data
      - ./backend/data/neo4j/logs:/logs
      - ./backend/data/neo4j/import:/var/lib/neo4j/import
      - ./backend/data/neo4j/plugins:/plugins
    networks:
      - graphrag-network

networks:
  graphrag-network:
    driver: bridge
